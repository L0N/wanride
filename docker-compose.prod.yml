# WanRide Production Docker Compose Configuration
version: '3.8'

services:
  # Main WanRide API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: wanride-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
      - SMS_API_KEY=${SMS_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FARE_NCD_FLAT_RATE=${FARE_NCD_FLAT_RATE}
      - FARE_BASE=${FARE_BASE}
      - FARE_DISTANCE_RATE=${FARE_DISTANCE_RATE}
      - FARE_TIME_RATE=${FARE_TIME_RATE}
      - FARE_RETURN_FEE_PERCENTAGE=${FARE_RETURN_FEE_PERCENTAGE}
      - FARE_AIRPORT_ADDON=${FARE_AIRPORT_ADDON}
      - COMMISSION_RATE=${COMMISSION_RATE}
      - NCD_BOUNDARY_NORTH=${NCD_BOUNDARY_NORTH}
      - NCD_BOUNDARY_SOUTH=${NCD_BOUNDARY_SOUTH}
      - NCD_BOUNDARY_EAST=${NCD_BOUNDARY_EAST}
      - NCD_BOUNDARY_WEST=${NCD_BOUNDARY_WEST}
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - wanride-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: wanride-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=wanride
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - wanride-network
    command: mongod --auth --bind_ip_all

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wanride-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - wanride-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: wanride-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - wanride-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB Backup Service
  backup:
    image: mongo:6.0
    container_name: wanride-backup
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup-data:/backups
    depends_on:
      - mongodb
    restart: "no"
    networks:
      - wanride-network
    # Run backup via cron job on host system
    profiles:
      - backup

# Named volumes for data persistence
volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  backup-data:
    driver: local

# Custom network for service communication
networks:
  wanride-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
